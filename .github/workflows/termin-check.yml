name: Termin-Check Führerscheinstelle

on:
  schedule:
    - cron: "7,37 4-11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: termin-check
  cancel-in-progress: false

jobs:
  zeitfenster:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.window.outputs.run }}
    steps:
      - id: window
        run: |
          H=$(TZ=Europe/Berlin date +%-H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || { [ "$H" -ge 6 ] && [ "$H" -lt 12 ]; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Außerhalb von 06-12 Uhr (jetzt $H Uhr) - übersprungen"
          fi

  check:
    needs: zeitfenster
    if: needs.zeitfenster.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Playwright installieren
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Termine prüfen
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: python check_termin.py

      - name: Zustand speichern
        if: always()
        run: |
          git config user.name "termin-check-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp state.json /tmp/state.json
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/state.json state.json
          git add state.json
          git diff --cached --quiet || (git commit -m "Zustand aktualisiert" && git push origin HEAD:main)

      - name: Screenshots hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-${{ github.run_number }}
          path: debug/
          retention-days: 3
          if-no-files-found: ignore
